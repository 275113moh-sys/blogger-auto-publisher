name: Blogger Auto Publisher

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  test-blogger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Blogger connection
        run: python publisher.py
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_ACCESS_TOKEN: ${{ secrets.BLOGGER_ACCESS_TOKEN }}
