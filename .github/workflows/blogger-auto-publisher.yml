name: Blogger Auto Publisher - Review Before Publish

on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: "Enable only after reviewing article.json and explicitly approving publication"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Blogger connection and publish only when explicitly approved
        run: python publisher.py
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_ACCESS_TOKEN: ${{ secrets.BLOGGER_ACCESS_TOKEN }}
          PUBLISH_APPROVED: ${{ inputs.publish_approved || false }}
